[project]
name = "clinic-ai-booking"
version = "0.1.0"
description = "Clinic appointment booking with chat (and later voice) AI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0,<0.116.0",
    "itsdangerous>=2.2.0,<3.0.0",
    "jinja2>=3.1.4,<4.0.0",
    "langchain>=1.3.18,<1.4.0",
    "langchain-ollama>=1.1.0,<1.2.0",
    "langgraph>=1.2.11,<1.3.0",
    "psycopg[binary]>=3.2.0,<4.0.0",
    "python-multipart>=0.0.12,<0.1.0",
    "sqlalchemy>=2.0.36,<2.1.0",
    "tzdata>=2025.1,<2027.0",
    "uvicorn[standard]>=0.32.0,<0.33.0",
]

[project.scripts]
clinic-ai-booking = "clinic_ai_booking.main:run"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.27.0,<0.29.0",
    "pytest>=8.3.0,<9.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
