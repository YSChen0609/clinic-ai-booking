services:
  app:
    image: clinic-ai-booking:${APP_IMAGE_TAG:-0.1.0}
    build:
      context: .
    ports:
      - target: 8000
        published: "${APP_PORT:-8000}"
        protocol: tcp
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-clinic}:${POSTGRES_PASSWORD:-clinic_dev_change_me}@db:5432/${POSTGRES_DB:-clinic}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      TZ: ${TZ:-Asia/Taipei}
      SESSION_SECRET: ${SESSION_SECRET:-clinic-dev-session-secret-change-me}
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
    restart: unless-stopped

  db:
    image: postgres:16.8-alpine
    pull_policy: missing
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clinic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clinic_dev_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-clinic}
      TZ: ${TZ:-Asia/Taipei}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - target: 5432
        published: "${POSTGRES_PORT:-5432}"
        protocol: tcp
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.9.0
    pull_policy: missing
    environment:
      TZ: ${TZ:-Asia/Taipei}
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - target: 11434
        published: "${OLLAMA_PORT:-11434}"
        protocol: tcp
    restart: unless-stopped

volumes:
  postgres_data:
  ollama_data:
