services:
  app:
    image: clinic-ai-booking:${APP_IMAGE_TAG:-0.1.0}
    build:
      context: .
    ports:
      - target: 8000
        published: "${APP_PORT:-8000}"
        protocol: tcp
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-clinic}:${POSTGRES_PASSWORD:-clinic_dev_change_me}@db:5432/${POSTGRES_DB:-clinic}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      VOICE_BASE_URL: http://voice:8790
      VOICE_ENABLED: ${VOICE_ENABLED:-true}
      VOICE_STT_MODEL: ${VOICE_STT_MODEL:-stt}
      VOICE_TTS_VOICE: ${VOICE_TTS_VOICE:-en_US-amy-medium}
      TZ: ${TZ:-Asia/Taipei}
      SESSION_SECRET: ${SESSION_SECRET:-clinic-dev-session-secret-change-me}
      NOTIFY_MODE: ${NOTIFY_MODE:-fake}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-auto}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REFRESH_TOKEN: ${GOOGLE_REFRESH_TOKEN:-}
      GOOGLE_CALENDAR_ID: ${GOOGLE_CALENDAR_ID:-primary}
      GOOGLE_SENDER: ${GOOGLE_SENDER:-}
      MS_TENANT_ID: ${MS_TENANT_ID:-}
      MS_CLIENT_ID: ${MS_CLIENT_ID:-}
      MS_CLIENT_SECRET: ${MS_CLIENT_SECRET:-}
      MS_USER_UPN: ${MS_USER_UPN:-}
      MS_REFRESH_TOKEN: ${MS_REFRESH_TOKEN:-}
      MS_CALENDAR_ID: ${MS_CALENDAR_ID:-}
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
      voice:
        condition: service_started
    restart: unless-stopped

  voice:
    # GHCR package for voicebox is private (anonymous pull → unauthorized).
    # Build from the public git tag instead (first build downloads Whisper + Piper).
    # https://github.com/agjs/voicebox
    image: clinic-ai-booking-voice:0.2.16
    build:
      context: https://github.com/agjs/voicebox.git#v0.2.16
    environment:
      VOICEBOX_ALLOW_INSECURE_BIND: "true"
      VOICEBOX_TTS_ENGINE: piper
      VOICEBOX_PIPER_VOICE: ${VOICE_TTS_VOICE:-en_US-amy-medium}
      VOICEBOX_CPU_THREADS: ${VOICEBOX_CPU_THREADS:-4}
      TZ: ${TZ:-Asia/Taipei}
    ports:
      - target: 8790
        published: "${VOICE_PORT:-8790}"
        protocol: tcp
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8790/health', timeout=5)",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  db:
    image: postgres:16.8-alpine
    pull_policy: missing
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clinic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clinic_dev_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-clinic}
      TZ: ${TZ:-Asia/Taipei}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - target: 5432
        published: "${POSTGRES_PORT:-5432}"
        protocol: tcp
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.9.0
    pull_policy: missing
    environment:
      TZ: ${TZ:-Asia/Taipei}
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - target: 11434
        published: "${OLLAMA_PORT:-11434}"
        protocol: tcp
    restart: unless-stopped

volumes:
  postgres_data:
  ollama_data:
